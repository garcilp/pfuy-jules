<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players · Platfighters.uy</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar glass pill">
  <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="">Platfighters<span class="tld">.uy</span></a>
  <span class="spacer"></span>
  <nav><a class="nav-active" aria-current="page">Players</a><a href="events.html">Events</a><a href="rankings.html">Rankings</a></nav>
  <span class="badge">PLAYER DIRECTORY</span>
</header>
<main class="directory page-single">
  <section class="directory-head">
    <div><div class="eyebrow mono">START.GG PLAYER DATA</div><h1>Players</h1><p class="muted">Browse competitors across the games we follow.</p></div>
    <div class="directory-controls">
      <label class="search glass"><span aria-hidden="true">⌕</span><input id="player-search" type="search" placeholder="Search players or tags" autocomplete="off" aria-label="Search players"></label>
      <div class="directory-filter-row">
        <label class="game-filter-wrap"><span class="sr-only">Filter by game</span><select id="game-filter" class="game-filter glass" aria-label="Filter players by game"><option value="">All games</option></select></label>
        <label class="game-filter-wrap"><span class="sr-only">Player list display</span><select id="player-view" class="game-filter glass" aria-label="Player list display"><option value="condensed" selected>Condensed list</option><option value="cards">Cards</option></select></label>
      </div>
    </div>
  </section>
  <p id="directory-status" class="directory-status mono muted" aria-live="polite">Loading player profiles…</p>
  <section id="player-list" class="player-list" aria-label="Player list"></section>
</main>
<footer class="foot mono muted">Platfighters.uy · Player directory</footer>
<script src="js/players.js"></script>
</body>
</html>
