<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking Creator · Platfighters.uy</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/creator.css">
</head>
<body class="creator-page">
<header class="topbar glass pill">
  <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="">Platfighters<span class="tld">.uy</span></a>
  <span class="spacer"></span>
  <nav>
    <a href="players.html" data-i18n="nav.players">Players</a>
    <a href="events.html" data-i18n="nav.events">Events</a>
    <a class="nav-active" aria-current="page" href="rankings.html" data-i18n="nav.rankings">Rankings</a>
  </nav>
  <div class="lang glass pill"><button type="button" class="lang-btn on" data-lang="en">EN</button><button type="button" class="lang-btn" data-lang="es">ES</button></div>
  <span class="badge" data-i18n="badge.sample">SAMPLE DATA</span>
</header>

<main class="page">
  <section class="head-panel glass">
    <div class="head-text">
      <div class="crumb">Rankings › <span id="crumbGame">Rivals 2</span> › New ranking</div>
      <div class="title-row"><h1>New power ranking</h1><span class="tagpill">DRAFT</span></div>
      <div id="sub" class="muted" style="font-size:14px"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn glass pill" data-act="save">Save draft</button>
      <a id="preview" class="btn glass pill" href="ranking.html" target="_blank" rel="noopener" title="Opens ranking.html from the rankings pages, if you have them next to this folder">Preview</a>
      <button type="button" class="btn primary" disabled title="Publishing needs a backend">Publish</button>
    </div>
  </section>

  <div class="layout">
    <div id="side" class="side-col"></div>
    <div class="col">
      <section id="details" class="panel glass"></section>
      <section id="editor" class="panel glass"></section>
    </div>
  </div>
</main>

<footer class="foot mono muted" data-i18n="footer.creator">Platfighters.uy · Community Rankings</footer>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/creator.js"></script>
</body>
</html>
