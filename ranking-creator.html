<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking Creator · Platfighters.uy</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/creator.css">
</head>
<body class="creator-page">
<header class="topbar glass pill">
  <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="">Platfighters<span class="tld">.uy</span></a>
  <span class="spacer"></span>
  <nav>
    <a href="players.html" data-i18n="nav.players">Players</a>
    <a href="events.html" data-i18n="nav.events">Events</a>
    <a class="nav-active" aria-current="page" href="rankings.html" data-i18n="nav.rankings">Rankings</a>
  </nav>
  <div class="lang glass pill"><button type="button" class="lang-btn on" data-lang="en">EN</button><button type="button" class="lang-btn" data-lang="es">ES</button></div>
  <span class="badge" data-i18n="badge.sample">SAMPLE DATA</span>
</header>

<main class="page">
  <section class="head-panel glass">
    <div class="head-text">
      <div class="crumb">Rankings › <span id="crumbGame">Rivals 2</span> › New ranking</div>
      <div class="title-row"><h1>New power ranking</h1><span class="tagpill">DRAFT</span></div>
      <div id="sub" class="muted" style="font-size:14px"></div>
    </div>
    <div class="actions">
      <div class="action-group-preview">
        <button type="button" id="previewBtn" class="btn glass pill" data-act="preview">Preview</button>
      </div>
      <div class="action-group-io">
        <button type="button" id="importBtn" class="btn glass pill" data-act="import">Import</button>
        <button type="button" id="exportBtn" class="btn glass pill" data-act="export">Export</button>
      </div>
      <div class="action-group-share">
        <button type="button" id="shareBtn" class="btn glass pill" data-act="share">Share</button>
        <button type="button" id="exportImgBtn" class="btn glass pill" data-act="export-image">Export Image</button>
      </div>
      <div id="adminActionGroup" class="action-group-admin" hidden>
        <button type="button" id="publishBtn" class="btn primary pill" data-act="publish">Publish</button>
      </div>
      <input type="file" id="importFileInput" accept=".json,application/json" hidden>
    </div>
  </section>

  <div class="layout">
    <div id="side" class="side-col"></div>
    <div class="col">
      <section id="details" class="panel glass"></section>
      <section id="editor" class="panel glass"></section>
    </div>
  </div>

  <dialog id="player-select-modal" class="player-select-modal glass">
    <div class="modal-header">
      <div>
        <h2 id="playerModalTitle">Select Player</h2>
        <div id="playerModalSub" class="sub muted">Search and select a player from the directory</div>
      </div>
      <button type="button" class="x glass pill" id="closePlayerModalBtn" aria-label="Close">×</button>
    </div>
    <div class="player-search-bar">
      <input type="search" id="playerSearchInput" class="inp" placeholder="Search by gamer tag, ID, or alias..." autocomplete="off">
    </div>
    <div id="playerSelectList" class="player-select-list"></div>
  </dialog>

  <dialog id="event-select-modal" class="player-select-modal glass">
    <div class="modal-header">
      <div>
        <h2 id="eventModalTitle">Select Event Result</h2>
        <div id="eventModalSub" class="sub muted">Select an event from this player's tournament history</div>
      </div>
      <button type="button" class="x glass pill" id="closeEventModalBtn" aria-label="Close">×</button>
    </div>
    <div id="eventSelectList" class="player-select-list"></div>
    <div style="margin-top:14px;display:flex;justify-content:flex-end;">
      <button type="button" class="btn glass pill" id="addBlankResultBtn">+ Add blank result</button>
    </div>
  </dialog>
</main>

<footer class="foot mono muted" data-i18n="footer.creator">Platfighters.uy · Community Rankings</footer>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/creator.js"></script>
</body>
</html>
